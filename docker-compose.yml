services:
  postgres:
    image: postgres:16-alpine
    container_name: prism-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      # Bind strictly to 127.0.0.1 (loopback) to prevent network exposure.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - prism_hub_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prism-hub-network

networks:
  prism-hub-network:
    driver: bridge

volumes:
  prism_hub_postgres_data:
    name: prism_hub_postgres_data
